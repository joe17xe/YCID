name: Contrôles Solid'Pilot

# Rien ne tournait avant un merge. Neuf PR ont été déployées et les huit
# pannes constatées ont toutes été trouvées par lecture humaine ou par
# l'utilisateur en production — aucune par la machine.
#
# Ces contrôles ferment ce trou, chacun visant une panne réellement
# subie :
#   · tsc          — les ruptures de type
#   · check:selects — une colonne demandée qui n'existe plus au schéma.
#                     C'est le rapport IA généré « sur 0 phase », et la
#                     requête `decisions.label` trouvée le jour même
#                     où ce contrôle a été écrit
#   · check:rbac   — la matrice des droits en désaccord avec les policies
#   · check:policies — une policy RLS qui interroge sa propre table.
#                     C'est la récursion infinie de la 0041 : six jours
#                     pendant lesquels AUCUNE validation n'était
#                     possible, trouvée par l'utilisateur en recette
#   · check:mobile — un tableau qui sort du cadre du téléphone. Rien
#                     ne doit défiler latéralement : chaque tableau se
#                     replie en cartes sous 640 px
#   · build        — ce que le déploiement ferait, mais AVANT le merge
#
# Aucun secret n'est nécessaire : le build passe sans les variables
# Supabase, vérifié avant d'écrire ce fichier.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Une PR poussée trois fois de suite n'a pas besoin de trois exécutions :
# seule la dernière compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    # Même runner que le déploiement : le dépôt est privé et les PR
    # viennent toutes de la même organisation, il n'y a pas de code
    # tiers à exécuter. À revoir si le dépôt s'ouvre aux contributions
    # externes — `npm ci` exécute les scripts d'installation.
    runs-on: [self-hosted, ycid]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Colonnes demandées vs schéma
        run: npm run check:selects

      - name: Matrice des droits vs policies
        run: npm run check:rbac

      - name: Policies RLS non récursives
        run: npm run check:policies

      - name: Rien ne sort du cadre du téléphone
        run: npm run check:mobile

      - name: Build
        run: npm run build

      # 91 erreurs à ce jour : bloquer ici arrêterait toutes les PR.
      # Informatif tant que la dette n'est pas résorbée — à passer
      # bloquant dès qu'elle atteint zéro, sinon le compteur remonte.
      - name: Lint (informatif)
        run: npm run lint
        continue-on-error: true
